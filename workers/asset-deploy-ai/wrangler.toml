# Asset Deploy AI Worker — UUID SSOT, dedupe, production deploy planner
# Deploy:  cd workers/asset-deploy-ai && npx wrangler deploy
# Dev:     npx wrangler dev

name = "grudge-asset-deploy-ai"
main = "src/index.js"
compatibility_date = "2025-03-01"
workers_dev = true

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://grudge-pipeline.vercel.app,https://molochdagod.github.io,*.grudge-studio.com,*.vercel.app,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173"
# Optional: set via `wrangler secret put ADMIN_TOKEN` for live R2 purge
# ADMIN_TOKEN = ""

# Asset registry (deterministic grudgeUuid)
[[d1_databases]]
binding = "DB"
database_name = "grudge-assets-db"
database_id = "3eeadd9e-832d-4d2e-bb14-8ddf75b3ac59"

# Binary assets
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "grudge-assets"

# Optional AI job log (reuse hub if available — soft fail if missing)
# Uncomment when binding is confirmed in account:
# [[d1_databases]]
# binding = "AI_DB"
# database_name = "grudge-ai-hub"
# database_id = "42ada55e-2095-46da-840b-6bb301a57253"

[[routes]]
pattern = "asset-deploy.grudge-studio.com/*"
zone_name = "grudge-studio.com"
